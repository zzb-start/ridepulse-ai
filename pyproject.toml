[project]
name = "ridepulse"
version = "0.1.0"
description = "RidePulse AI — 全球骑行用户需求雷达"
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src/ridepulse"]
omit = ["tests/*"]
